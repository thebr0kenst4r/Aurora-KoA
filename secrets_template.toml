# Default deployment mode ("gaming", "realtor", or any custom mode)
APP_MODE = "gaming"

# Unique identifier per deployment site so multiple sites share GitHub/R2 cleanly
SITE_ID = "gaming"

# Optional persistent data directory for dedicated VPS/Docker servers (defaults to ".")
DATA_DIR = "."

# Gemini API Keys (comma-separated for automatic round-robin rotation)
GEMINI_KEYS = "AIzaSyYourKey1,AIzaSyYourKey2,AIzaSyYourKey3"

# Discord Bot Credentials (Required for Gaming Mode)
DISCORD_TOKEN = "your_discord_bot_token_here"
ALLOWED_CHANNELS = "123456789012345678,987654321098765432"

# Web Portal Passkeys
AERITH_KEY = "your_sovereign_admin_password"
ALLIANCE_KEY = "your_alliance_member_password"

# GitHub REST, GraphQL & Actions CI/CD Access (Self-Upgrades + db-vault backups)
GITHUB_TOKEN = "ghp_YourGitHubPersonalAccessTokenHere"
GITHUB_REPO = "thebr0kenst4r/aurora-koa"
GITHUB_VAULT_BRANCH = "db-vault"

# Cloudflare R2 Object Storage (Dated YYYY/MM/DD Media, DB Backups, Code Snapshots & Changelogs)
R2_ACCOUNT_ID = "your_cloudflare_account_id"
R2_ACCESS_KEY_ID = "your_r2_access_key_id"
R2_SECRET_ACCESS_KEY = "your_r2_secret_access_key"
R2_BUCKET_NAME = "aurora-sovereign-vault"
R2_PUBLIC_URL = ""
