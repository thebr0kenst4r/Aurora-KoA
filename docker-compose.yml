version: "3.9"

services:
  aurora-core:
    build: .
    container_name: aurora-sovereign-core
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
    volumes:
      - ./persistent_data:/app/data
      - ./media_vault:/app/media_vault
